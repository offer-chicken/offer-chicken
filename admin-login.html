<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Owner Login - The Offer Meat Shop</title>

    <link rel="stylesheet" href="/admin.css">

</head>

<body class="login-page">


    <div class="login-card">


        <div class="admin-logo-icon login-logo">
            MS
        </div>


        <h1>
            The Offer Meat Shop
        </h1>


        <p class="login-subtitle">
            Owner / Admin Login
        </p>


        <div class="account-tabs login-tabs">

            <button
                type="button"
                class="account-tab active"
                id="admin-tab-password"
            >
                Password
            </button>

            <button
                type="button"
                class="account-tab"
                id="admin-tab-otp"
            >
                Login with OTP
            </button>

        </div>



        <form id="admin-login-form">


            <div class="login-field">

                <label for="admin-email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="admin-email"
                    placeholder="Enter owner email"
                    required
                >

            </div>



            <div class="login-field" id="admin-password-field">

                <label for="admin-password">
                    Password
                </label>

                <input
                    type="password"
                    id="admin-password"
                    placeholder="Enter password"
                >

            </div>



            <div class="login-field" id="admin-otp-field" style="display:none;">

                <label for="admin-otp">
                    OTP
                </label>

                <input
                    type="text"
                    id="admin-otp"
                    maxlength="6"
                    placeholder="6-digit OTP"
                >

            </div>



            <div class="login-field" id="admin-new-password-field" style="display:none;">

                <label for="admin-new-password">
                    Set / reset password
                </label>

                <input
                    type="password"
                    id="admin-new-password"
                    placeholder="At least 6 characters"
                >

            </div>



            <button
                type="submit"
                class="login-button"
                id="admin-submit-button"
            >
                Login
            </button>


            <button
                type="button"
                class="login-button"
                id="admin-send-otp-button"
                style="display:none; margin-top:10px; background:#333;"
            >
                Send OTP
            </button>


            <button
                type="button"
                class="login-button"
                id="admin-save-password-button"
                style="display:none; margin-top:10px; background:#198754;"
            >
                Save password
            </button>


            <p
                id="login-message"
                class="login-message"
            ></p>

        </form>


        <p class="login-footer">
            The Offer Meat Shop Owner Panel
        </p>


    </div>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="/admin-login.js"></script>


</body>

</html>
